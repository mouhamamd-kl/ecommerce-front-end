services:
  frontend:
    build: .
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_CURRENCY: ${VITE_CURRENCY:-USD}
      API_PROXY_TARGET: http://app:3000
    ports:
      - "5173:5173"
    networks:
      - warehouse

networks:
  warehouse:
    external: true
    name: ecommerce-warehouse
